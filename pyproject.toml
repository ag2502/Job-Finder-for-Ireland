[project]
name = "jobfinder"
version = "0.1.0"
description = "Sorted Place: every job in Ireland, in one place. Aggregates active openings from company career pages and ATS APIs"
readme = "README.md"
# AGPL, the owner's choice (first needed for PyMuPDF, used by CV tailoring until it was
# removed on 2026-09-28); see LICENSE. The site links its own source from the footer,
# which is what the licence asks of a network service.
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Capped below 1.0, which removed the Modest backend (`selectolax.parser`) that
    # every HTML adapter and html_to_text import. Moving to Lexbor changes parsing
    # output, so it needs its own change with the adapter tests checked.
    "selectolax>=0.3.21,<1.0",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    # Postgres driver. SQLite is the local default, but the deployed crawler runs
    # against hosted Postgres and SQLAlchemy cannot connect without a driver present.
    "psycopg[binary]>=3.1",
    # The web finder. Previously installed by hand and never declared, so a fresh
    # install - a CI runner, a Vercel build - could crawl but not serve.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    # CV parsing, imported lazily when a PDF or DOCX is uploaded.
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Browser-assisted detection only (`jobfinder render-blocked`), run weekly in CI. Never
# needed by the crawl or the website.
render = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
