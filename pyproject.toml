[project]
name = "jobfinder"
version = "0.1.0"
description = "Dublin job portal - aggregates active openings from company career pages and ATS APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "selectolax>=0.3.21",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    # Postgres driver. SQLite is the local default, but the deployed crawler runs
    # against hosted Postgres and SQLAlchemy cannot connect without a driver present.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
