[project]
name = "jobfinder"
version = "0.1.0"
description = "Dublin job portal - aggregates active openings from company career pages and ATS APIs"
readme = "README.md"
# AGPL because tailoring edits PDFs with PyMuPDF, which is AGPL; see LICENSE. The site
# links its own source from the footer, which is what the licence asks of a network service.
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "selectolax>=0.3.21",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    # Postgres driver. SQLite is the local default, but the deployed crawler runs
    # against hosted Postgres and SQLAlchemy cannot connect without a driver present.
    "psycopg[binary]>=3.1",
    # The web finder. Previously installed by hand and never declared, so a fresh
    # install - a CI runner, a Vercel build - could crawl but not serve.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    # CV parsing, imported lazily when a PDF or DOCX is uploaded.
    "pypdf>=4.0",
    "python-docx>=1.1",
    # Tailoring a PDF CV in place: removing old words and setting new ones in the CV's
    # own fonts, keeping its layout. AGPL-3.0, which is why this project is too.
    "pymupdf>=1.26",
]

[project.optional-dependencies]
# Browser-assisted detection only (`jobfinder render-blocked`), run weekly in CI. Never
# needed by the crawl or the website.
render = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
