{# Replaces the Apply button once a job is marked. The record stays in the list until
   the next search rather than vanishing under the cursor of someone who just clicked
   it, and Undo swaps the Apply button straight back. #}
<span class="applied-mark">
  <span class="stamp stamp--filled">applied</span>
  <button class="linkish small" hx-post="/applications/remove"
          hx-vals='{{ {"advert_key": advert_key, "title": title|default(""), "company": company|default(""), "url": url|default("")}|tojson }}'
          hx-target="closest .applied-mark" hx-swap="outerHTML"
          title="Put this job back in your results">Undo</button>
</span>
