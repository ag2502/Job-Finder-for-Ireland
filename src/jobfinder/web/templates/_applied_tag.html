{# Replaces the Apply button once a job is marked. The row stays put until the next
   search rather than vanishing under the cursor of someone who has just clicked it. #}
<span class="applied-mark">
  <span class="tag">applied</span>
  <button class="linkish small" hx-post="/applications/remove" hx-vals='{"advert_key": "{{ advert_key }}"}'
          hx-target="closest .applied-mark" hx-swap="outerHTML"
          title="Put this job back in your results">Undo</button>
</span>
