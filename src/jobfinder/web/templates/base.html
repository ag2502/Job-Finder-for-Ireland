<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dublin Job Finder{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  :root{
    --bg:#f7f7f5; --card:#fff; --ink:#1a1a18; --muted:#6b6b65;
    --line:#e3e3de; --accent:#1a6b4a; --accent-soft:#e8f3ee; --warn:#a35b00;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16171a; --card:#1e1f23; --ink:#ececed; --muted:#9a9aa0;
           --line:#2e3036; --accent:#5fbf92; --accent-soft:#1c2f27; --warn:#d99a4e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{border-bottom:1px solid var(--line);background:var(--card)}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  header .wrap{display:flex;align-items:center;gap:20px;height:58px}
  header strong{font-size:16px}
  header nav{margin-left:auto;display:flex;gap:18px;font-size:14px}
  main{padding:28px 0 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
  h1{font-size:24px;margin:0 0 8px}
  h2{font-size:17px;margin:0 0 12px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  label{display:block;font-weight:600;margin:16px 0 6px;font-size:14px}
  input[type=file],input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
  button{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:10px 18px;
    font:inherit;font-weight:600;cursor:pointer}
  button.secondary{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
    padding:5px 12px;font-size:13px;cursor:pointer;background:var(--bg)}
  .chip input{margin:0}
  .job{border-bottom:1px solid var(--line);padding:15px 0}
  .job:last-child{border-bottom:0}
  .job h3{margin:0 0 3px;font-size:15px}
  .job h3 a{text-decoration:none}
  .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .score{background:var(--accent-soft);color:var(--accent);border-radius:5px;
    padding:2px 7px;font-size:12px;font-weight:700;white-space:nowrap}
  .badge{background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
  .why{font-size:13px;color:var(--muted);margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
  .stat b{display:block;font-size:20px}
  .scroll{overflow-x:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr} }
  table.jobs{margin-top:10px}
  table.jobs th{white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  table.jobs td{vertical-align:top;padding:11px 10px}
  table.jobs tr:hover td{background:var(--accent-soft)}
  td.co{font-weight:600;white-space:nowrap;width:1%}
  .pos{font-weight:600}
  td.date{white-space:nowrap;color:var(--muted);width:1%}
  .sub{font-size:12px;margin-top:3px;line-height:1.4}
  a.apply{display:inline-block;white-space:nowrap;border:1px solid var(--accent);
    color:var(--accent);border-radius:6px;padding:5px 11px;font-size:13px;
    font-weight:600;text-decoration:none}
  a.apply:hover{background:var(--accent);color:#fff}
  .exp{color:var(--warn);font-weight:600}
  /* Rules off the roles the searcher asked for from the ones merely adjacent to them. */
  .tier-break td{background:var(--bg);font-weight:600;text-transform:uppercase;
    letter-spacing:.05em;font-size:11px;padding-top:10px;padding-bottom:10px}
  /* A button that reads as a link: used for sign-out and undo, which must be POSTs
     rather than links because they change something. */
  .linkish{background:none;border:0;padding:0;font:inherit;color:var(--accent);
    cursor:pointer;text-decoration:underline}
  .linkish:hover{opacity:.8}
  .applied-mark{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .error{color:#b3261e;background:#fde8e6;border-radius:6px;padding:9px 12px;font-size:14px}
  .notice{color:var(--accent);background:var(--accent-soft);border-radius:6px;
    padding:9px 12px;font-size:14px}
  @media (prefers-color-scheme: dark){
    .error{color:#ffb4ab;background:#3b1a17}
  }
  /* Scoped to the sign-in form on purpose. As a bare `form label` this also caught the
     finder's role chips - every one of which is a label inside a form - and stacked the
     checkbox above its own text at full width, turning a compact grid into a column of
     three-line boxes. */
  .auth-form label{display:block;margin:12px 0 4px}
  .auth-form input{display:block;width:100%;margin-top:4px;padding:8px 10px;
    border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);
    font:inherit;box-sizing:border-box}
  .tag{border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:0 5px;
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    vertical-align:middle;white-space:nowrap}
  .req{background:var(--warn);color:#fff;border-radius:4px;padding:1px 6px;
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    vertical-align:middle}
  button:disabled{opacity:.45;cursor:not-allowed}
  .htmx-indicator{opacity:0;transition:opacity .2s}
  .htmx-request .htmx-indicator,.htmx-request.htmx-indicator{opacity:1}
  /* Search takes several seconds: the panel says so, and stays in view while paging. */
  .loading{display:none;align-items:center;gap:14px;position:sticky;top:12px;z-index:5;
    background:var(--card);border:1px solid var(--accent);border-radius:10px;
    padding:14px 18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  .loading.htmx-request{display:flex}
  .loading strong{display:block}
  .spinner{flex:none;width:22px;height:22px;border-radius:50%;
    border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #results{transition:opacity .15s}
  #results.htmx-request{opacity:.35;pointer-events:none}
  @media (prefers-reduced-motion:reduce){ .spinner{animation:none;border-top-color:var(--accent)} }
  .err{background:#fdecec;color:#a12; border:1px solid #f3c7c7;padding:10px 12px;border-radius:7px}
  @media (prefers-color-scheme:dark){ .err{background:#3a1f1f;color:#f0b4b4;border-color:#5a2c2c} }
</style>
</head>
<body>
<header><div class="wrap">
  <strong>Dublin Job Finder</strong>
  <nav>
    <a href="/">Search</a>
    <a href="/directory">Employers</a>
    {% if show_admin_link %}<a href="/admin">Coverage</a>{% endif %}
    <a href="/privacy">Privacy</a>
    {% if accounts_enabled %}
      {% if account %}
        <a href="/applications">Applications</a>
        <form method="post" action="/logout" style="display:inline">
          <button class="linkish" title="Signed in as {{ account.email }}">Sign out</button>
        </form>
      {% else %}
        <a href="/login">Sign in</a>
      {% endif %}
    {% endif %}
  </nav>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
