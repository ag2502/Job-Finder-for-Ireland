name: Crawl

# GitHub Actions is the crawler host: free on public repositories, 2,000 minutes a
# month on private ones, and it needs no server to maintain. Runs are staggered so
# Tier 1 ATS sources refresh often while heavier sources run less frequently.
on:
  schedule:
    - cron: "0 */6 * * *"   # every six hours
  workflow_dispatch:
    inputs:
      adapter:
        description: "Restrict the run to one adapter (optional)"
        required: false

concurrency:
  # Never let two crawls reconcile against the same database at once.
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      JOBFINDER_DATABASE_URL: ${{ secrets.JOBFINDER_DATABASE_URL }}
      JOBFINDER_LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # A broken reconciler must never reach the production database: a bug here
        # could close jobs that are still open, which is the one failure this project
        # exists to prevent.
        run: pytest -q

      - name: Seed registry
        run: jobfinder seed

      - name: Crawl
        run: |
          if [ -n "${{ github.event.inputs.adapter }}" ]; then
            jobfinder crawl --adapter "${{ github.event.inputs.adapter }}"
          else
            jobfinder crawl
          fi

      - name: Summary
        if: always()
        run: jobfinder stats >> "$GITHUB_STEP_SUMMARY"
