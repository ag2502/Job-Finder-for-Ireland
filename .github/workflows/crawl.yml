name: Crawl

# Fetching only. This workflow does one thing — pull current openings and reconcile them
# — because that is the only part of the pipeline whose underlying data changes hourly.
#
# Growing the registry (import, detection, extraction) lives in `registry.yml` on a
# weekly schedule. Splitting them matters: detection takes 30-60 minutes across a few
# hundred unknown hosts and almost never finds anything new, so running it four times a
# day spent most of the CI budget re-confirming what was already known and pushed this
# job toward its timeout for no benefit.
#
# The two workflows never call each other. `registry.yml` registers sources with
# `last_success_at = NULL`, which `select_sources` treats as always due, so the next
# crawl picks them up on its own.

on:
  schedule:
    # Roughly every six hours. GitHub queues scheduled workflows with everyone else's,
    # so expect drift of minutes to tens of minutes; nothing here depends on exact times.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      adapter:
        description: "Restrict the run to one adapter (optional)"
        required: false
      all_sources:
        description: "Ignore the staleness schedule and crawl everything"
        type: boolean
        default: false

permissions:
  # The snapshot the website serves is committed back to the repository at the end of
  # the run, which needs write access to contents.
  contents: write

concurrency:
  # Shared with registry.yml. Both write to the same database, and the reconciler's
  # guarantees assume one writer: two runs interleaving could close jobs that the other
  # run had just seen as open.
  group: jobfinder-db
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Steady-state runs take 5-10 minutes because the staleness rule skips most sources.
    # The headroom is for a cold start, where every source is due at once.
    timeout-minutes: 60

    env:
      JOBFINDER_LOG_LEVEL: INFO
      # JOBFINDER_DATABASE_URL is deliberately NOT set job-wide. It used to be, and that
      # meant `pytest` ran the web tests against the production database: when Neon hit
      # its data-transfer quota the tests could not connect, the run failed, and the
      # crawl never executed — a website problem silently stopped the crawler. The steps
      # that genuinely write to production now opt in individually, and the tests fall
      # through to the committed snapshot instead.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fail fast if the database is not configured
        env:
          JOBFINDER_DATABASE_URL: ${{ secrets.JOBFINDER_DATABASE_URL }}
        # A missing secret would otherwise crawl into a local SQLite file that is
        # discarded when the container exits — a run that looks green and does nothing.
        run: |
          if [ -z "$JOBFINDER_DATABASE_URL" ]; then
            echo "::error::JOBFINDER_DATABASE_URL is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run tests
        # A broken reconciler must never reach the production database: a bug here could
        # close jobs that are still open, and that is the one failure this project exists
        # to prevent. Three minutes is cheap insurance against an unrecoverable mistake.
        run: pytest -q

      - name: Crawl
        env:
          JOBFINDER_DATABASE_URL: ${{ secrets.JOBFINDER_DATABASE_URL }}
        run: |
          args=""
          if [ -n "${{ github.event.inputs.adapter }}" ]; then
            args="$args --adapter ${{ github.event.inputs.adapter }}"
          fi
          if [ "${{ github.event.inputs.all_sources }}" = "true" ]; then
            args="$args --all"
          fi
          jobfinder crawl $args

      - name: Refresh the snapshot the website serves
        env:
          JOBFINDER_DATABASE_URL: ${{ secrets.JOBFINDER_DATABASE_URL }}
        # The site reads the committed file, never the database, so a crawl does not
        # reach visitors until the snapshot is rebuilt and pushed — the push is what
        # triggers the Vercel deployment that picks it up.
        run: python scripts/export_snapshot.py

      - name: Commit the snapshot
        run: |
          if git diff --quiet -- data/jobfinder.db; then
            echo "snapshot unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobfinder.db
          git commit -m "Refresh job snapshot"
          # registry.yml pushes to this branch too, and the shared concurrency group only
          # serialises whole runs — it does not guarantee the remote is where checkout
          # left it. Rebasing avoids a non-fast-forward rejection at the end of an
          # otherwise successful hour-long crawl.
          git pull --rebase --autostash origin main
          git push

      - name: Summary
        env:
          JOBFINDER_DATABASE_URL: ${{ secrets.JOBFINDER_DATABASE_URL }}
        if: always()
        run: |
          {
            echo "## Crawl"
            echo '```'
            jobfinder stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
